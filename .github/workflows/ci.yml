name: CI

on:
  push:
    branches: ["claude/safaribrain-master-build-gvrrec"]
  pull_request:
    branches: ["claude/safaribrain-master-build-gvrrec"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (typechecks apps/api, apps/web, packages/shared)
        run: pnpm build
