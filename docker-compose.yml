version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: safaribrain
      POSTGRES_PASSWORD: safaribrain
      POSTGRES_DB: safaribrain
    ports:
      - "5432:5432"
    volumes:
      - safaribrain_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  safaribrain_pgdata:
